<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Carteira Digital - Depósito</title>
</head>
<body>
    <h2>Carteira Digital - Realizar Depósito</h2>

    <label for="contaId">ID da Conta:</label>
    <input type="number" id="contaId" value="1"><br><br>

    <label for="valor">Valor do Depósito (R$):</label>
    <input type="number" id="valor" step="0.01"><br><br>

    <button id="btnDepositar" onclick="realizarDeposito()">Depositar</button>

    <p id="resultado"></p>

    <script>
        function realizarDeposito() {
            const contaId = document.getElementById("contaId").value;
            const valor = document.getElementById("valor").value;

            fetch(`/api/contas/${contaId}/depositar?valor=${valor}`, { method: 'POST' })
                .then(response => response.text())
                .then(texto => {
                    document.getElementById("resultado").innerText = texto;
                });
        }
    </script>
</body>
</html>
